<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Swiftgrocers">
  <!--
    The mark for dark surfaces: the till rail on a filled header, the sign-in
    mosaic. Same drawing as logo-mark.svg with the colour taken out. On a green
    or black ground the leaf green disappears, so the bag goes solid white and
    the produce is held apart by opacity rather than by hue.
  -->
  <circle cx="11.9" cy="11.6" r="3.1" fill="#FFFFFF" fill-opacity="0.42"/>
  <circle cx="19.6" cy="10.6" r="3.9" fill="#FFFFFF" fill-opacity="0.7"/>

  <path d="M10.5 12.8V7.4a5.5 5.5 0 0 1 11 0v5.4" fill="none" stroke="#FFFFFF"
        stroke-opacity="0.9" stroke-width="1.9" stroke-linecap="round"/>

  <path d="M4.6 12.4h22.8v11.4A5.2 5.2 0 0 1 22.2 29H9.8a5.2 5.2 0 0 1-5.2-5.2Z" fill="#FFFFFF"/>

  <!-- Grommets are punched out rather than painted, so they work on any ground. -->
  <g fill="#000000" fill-opacity="0.28">
    <circle cx="10.5" cy="15.6" r="1.15"/>
    <circle cx="21.5" cy="15.6" r="1.15"/>
  </g>
</svg>
