<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Swiftgrocers">
  <!--
    The mark for the thermal printer — SPEC §12.

    A receipt head is 1-bit: it burns a dot or it leaves the paper white. There
    is no grey, so the colour mark cannot be reused. Reversing it to solid black
    does not work either — the produce, the handle and the bag all collapse into
    one blob at 203 dpi.

    So the shapes are held apart by white knockouts instead of by tone: the
    front fruit carries a white ring, the handle is a stroke with paper either
    side of it, and the grommets are punched white out of the bag. Every gap
    here is at least 0.6 units, which is about two dots at the size this prints
    (roughly 12mm), so nothing closes up.
  -->

  <!-- Back produce: outline only, so it reads as a separate round shape. -->
  <circle cx="11.9" cy="11.4" r="3.0" fill="none" stroke="#000000" stroke-width="1.4"/>

  <!-- Front produce: solid, with a white ring holding it off the one behind. -->
  <circle cx="19.6" cy="10.6" r="4.6" fill="#FFFFFF"/>
  <circle cx="19.6" cy="10.6" r="3.7" fill="#000000"/>

  <!-- Handle. -->
  <path d="M10.5 12.8V7.4a5.5 5.5 0 0 1 11 0v5.4" fill="none" stroke="#000000"
        stroke-width="1.9" stroke-linecap="round"/>

  <!-- Bag, solid — the shape that survives at any size. -->
  <path d="M4.6 12.4h22.8v11.4A5.2 5.2 0 0 1 22.2 29H9.8a5.2 5.2 0 0 1-5.2-5.2Z" fill="#000000"/>

  <!-- Grommets, punched white so the bag does not read as a plain rectangle. -->
  <g fill="#FFFFFF">
    <circle cx="10.5" cy="15.8" r="1.3"/>
    <circle cx="21.5" cy="15.8" r="1.3"/>
  </g>
</svg>
